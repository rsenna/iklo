[toolchain]
# Matches the toolchain CI installs (`.github/workflows/ci.yml` uses
# `dtolnay/rust-toolchain@stable`) so local builds and CI compile with the same
# compiler. Release cross-compilation is driven by `release.yml`, not by this
# file, so no target is pinned here.
channel = "stable"
components = ["rustfmt", "clippy"]
