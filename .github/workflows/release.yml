name: Release

on:
  push:
    tags:
      - 'v[0-9]*'

# `contents: write` is required from T012 onward: this workflow creates
# the actual GitHub Release, which needs write access to the repo's
# releases. Every step before the final "Create GitHub Release" step
# still only reads (validates, tests, builds, packages, checksums) --
# the token's write scope simply goes unused until that last step.
permissions:
  contents: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    env:
      # Single platform for now, per spec.md's Assumptions; a matrix
      # build is a later expansion. Job-level so the packaging and
      # checksum steps can't drift out of sync with each other.
      TARGET: x86_64-unknown-linux-gnu
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Unlike ci.yml's shallow default: T014's release-notes script
          # needs full tag/commit history to run `git describe` against
          # previous tags.
          fetch-depth: 0
          # No authenticated git operations happen after checkout in this
          # phase; a later phase that needs to authenticate (e.g. `gh
          # release create`) does so via an explicit token, not a
          # persisted git credential.
          persist-credentials: false

      - name: Validate release tag against workspace version (FR-002, FR-004, FR-010)
        run: .github/scripts/validate-release-tag.sh "${GITHUB_REF_NAME}"

      - name: Reject re-publishing an existing tag (edge case, spec.md)
        # Checked early, before any build/test work: a duplicate-tag
        # rejection doesn't need the build to determine, so there's no
        # reason to spend CI minutes on a tag that's going to be
        # rejected anyway. GH_TOKEN is gh CLI's own env var convention
        # (auto-detected, not spliced into any run: script body).
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: .github/scripts/reject-existing-release.sh "${GITHUB_REF_NAME}"

      - name: Compute build identifier (FR-005)
        # GITHUB_RUN_NUMBER.GITHUB_RUN_ATTEMPT -- deterministic, and
        # (GITHUB_RUN_NUMBER, GITHUB_RUN_ATTEMPT) strictly increases
        # across successful releases (SC-003). Exposed as a step output
        # (not a job-level env var like TARGET) since it's produced by a
        # script rather than a static value.
        id: build_id
        # A bare `echo "value=$(cmd)"` would swallow a failing `cmd`:
        # the compound command's exit status is echo's, not the command
        # substitution's, so GitHub Actions' default `bash -e {0}` (no
        # `pipefail`) would never notice and the step would pass green
        # with an empty value -- silently producing a malformed,
        # unidentified release artifact instead of failing the job. A
        # separate assignment does propagate the failure correctly.
        run: |
          build_id="$(.github/scripts/build-identifier.sh)"
          echo "value=${build_id}" >> "$GITHUB_OUTPUT"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: stable

      - name: Cache cargo dependencies and build output
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Test (cargo test --locked)
        # --locked, not `make test`'s plain `cargo test`: an unlocked test
        # run silently rewrites a drifted Cargo.lock, so by the time the
        # --locked release build below runs, the lock would already be
        # "fixed" and the drift it's meant to catch would never surface.
        run: cargo test --locked

      - name: Build release binary (FR-002)
        # --locked: this is a release artifact users download -- fail loud
        # if Cargo.lock has drifted from the manifests rather than silently
        # building against dependency versions the lock file never recorded.
        run: cargo build --release -p iklo-cli --locked

      - name: Package release binary (FR-003)
        # Stages a target-triple-and-build-identifier-named copy under a
        # dedicated dist/ directory for T011 (checksums) and T012
        # (release creation) to consume. Per plan.md's Key Design
        # Decision #7, the actual GitHub Release is created once,
        # atomically, in T012 -- this step only prepares the asset; it
        # does not create or upload to a Release. BUILD_ID comes in via
        # step-level env (a YAML value, not spliced into the run: script
        # body), the same safe pattern as everywhere else in this file --
        # GITHUB_RUN_NUMBER/GITHUB_RUN_ATTEMPT are GitHub-controlled, not
        # attacker-influenced like a tag name, but there's no reason to
        # treat step outputs differently from job-level env vars here.
        env:
          BUILD_ID: ${{ steps.build_id.outputs.value }}
        run: |
          mkdir -p dist
          cp target/release/iklo "dist/iklo-${GITHUB_REF_NAME}-${TARGET}-${BUILD_ID}"

      - name: Generate SHA-256 checksums (FR-012)
        env:
          BUILD_ID: ${{ steps.build_id.outputs.value }}
        run: .github/scripts/generate-checksums.sh "dist/iklo-${GITHUB_REF_NAME}-${TARGET}-${BUILD_ID}"

      - name: Generate release notes (FR-006)
        run: .github/scripts/release-notes.sh "${GITHUB_REF_NAME}" > "${RUNNER_TEMP}/release-notes.md"

      - name: Create GitHub Release (FR-002, FR-003, FR-006, FR-008, FR-012)
        # Per plan.md's Key Design Decision #7: nothing PUBLICLY VISIBLE
        # exists until every asset is attached and the notes are set --
        # NOT created first and uploaded to afterward in separate
        # user-visible steps. (Correction: `gh release create` itself
        # internally makes separate API calls -- create as a draft,
        # upload each asset, then publish -- per its own --help text.
        # The guarantee this buys is "no published release before every
        # asset lands", not "one API call"; if asset upload fails
        # partway, a stray DRAFT release can be left behind. The dedup
        # check above only queries published releases, so it won't see
        # that draft -- a re-run of the same tag would create a second
        # draft rather than being rejected by it. Not handled here;
        # worth revisiting if it happens in practice.)
        # --verify-tag: if the pushed tag were somehow deleted remotely
        # mid-run, gh would otherwise silently create a NEW tag at
        # main's current HEAD and publish that instead -- shipping code
        # that was never what this job actually built and tested.
        # Every earlier step (validate, reject-duplicate, test, build,
        # package, checksum, notes) already exited nonzero and stopped
        # the job on its own failure, so reaching this step at all means
        # everything it depends on already succeeded; there is no
        # separate "did an earlier step fail" check to perform here.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUILD_ID: ${{ steps.build_id.outputs.value }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            "dist/iklo-${GITHUB_REF_NAME}-${TARGET}-${BUILD_ID}" \
            "dist/iklo-${GITHUB_REF_NAME}-${TARGET}-${BUILD_ID}.sha256" \
            --title "${GITHUB_REF_NAME}" \
            --notes-file "${RUNNER_TEMP}/release-notes.md" \
            --verify-tag
