name: Release

on:
  push:
    tags:
      - 'v[0-9]*'

# Least-privilege: through T011 this workflow only reads the repo -- it
# validates the tag, tests, builds, packages, and checksums, but
# publishes nothing.
# `contents: write` is deferred until T012, the task that actually creates
# the GitHub Release -- granting it here would hand a compromised build
# step needless write access to the repo via the default token.
permissions:
  contents: read

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    env:
      # Single platform for now, per spec.md's Assumptions; a matrix
      # build is a later expansion. Job-level so the packaging and
      # checksum steps can't drift out of sync with each other.
      TARGET: x86_64-unknown-linux-gnu
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Unlike ci.yml's shallow default: T014's release-notes script
          # needs full tag/commit history to run `git describe` against
          # previous tags.
          fetch-depth: 0
          # No authenticated git operations happen after checkout in this
          # phase; a later phase that needs to authenticate (e.g. `gh
          # release create`) does so via an explicit token, not a
          # persisted git credential.
          persist-credentials: false

      - name: Validate release tag against workspace version (FR-002, FR-004, FR-010)
        run: .github/scripts/validate-release-tag.sh "${GITHUB_REF_NAME}"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: stable

      - name: Cache cargo dependencies and build output
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Test (cargo test --locked)
        # --locked, not `make test`'s plain `cargo test`: an unlocked test
        # run silently rewrites a drifted Cargo.lock, so by the time the
        # --locked release build below runs, the lock would already be
        # "fixed" and the drift it's meant to catch would never surface.
        run: cargo test --locked

      - name: Build release binary (FR-002)
        # --locked: this is a release artifact users download -- fail loud
        # if Cargo.lock has drifted from the manifests rather than silently
        # building against dependency versions the lock file never recorded.
        run: cargo build --release -p iklo-cli --locked

      - name: Package release binary (FR-003)
        # Stages a target-triple-named copy under a dedicated dist/
        # directory for T011 (checksums) and T012 (release creation) to
        # consume. Per plan.md's Key Design Decision #7, the actual GitHub
        # Release is created once, atomically, in T012 -- this step only
        # prepares the asset; it does not create or upload to a Release.
        run: |
          mkdir -p dist
          cp target/release/iklo "dist/iklo-${GITHUB_REF_NAME}-${TARGET}"

      - name: Generate SHA-256 checksums (FR-012)
        run: .github/scripts/generate-checksums.sh "dist/iklo-${GITHUB_REF_NAME}-${TARGET}"
