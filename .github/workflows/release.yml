name: Release

on:
  push:
    tags:
      - 'v[0-9]*'

# Workflow-level default is read-only. Only the release job (below)
# escalates to contents: write, and only for the steps that actually
# need it -- GitHub Actions permissions are JOB-scoped, not step-scoped,
# so a single write-capable job would hand every one of its steps
# (including cargo build/test, which run arbitrary dependency code) a
# write-capable token whether they use it or not. Splitting into build
# (read) + release (write) is what actually enforces least-privilege,
# not a comment promising unused scope goes unused.
permissions:
  contents: read

jobs:
  build:
    name: Build & Package
    runs-on: ubuntu-latest
    env:
      # Single platform for now, per spec.md's Assumptions; a matrix
      # build is a later expansion. Job-level so the packaging and
      # checksum steps can't drift out of sync with each other.
      TARGET: x86_64-unknown-linux-gnu
    outputs:
      build_id: ${{ steps.build_id.outputs.value }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Unlike ci.yml's shallow default: T014's release-notes script
          # needs full tag/commit history to run `git describe` against
          # previous tags.
          fetch-depth: 0
          # No authenticated git operations happen after checkout in this
          # phase; a later phase that needs to authenticate (e.g. `gh
          # release create`) does so via an explicit token, not a
          # persisted git credential.
          persist-credentials: false

      - name: Validate release tag against workspace version (FR-002, FR-004, FR-010)
        run: .github/scripts/validate-release-tag.sh "${GITHUB_REF_NAME}"

      - name: Reject re-publishing an existing tag (edge case, spec.md)
        # Checked early, before any build/test work: a duplicate-tag
        # rejection doesn't need the build to determine, so there's no
        # reason to spend CI minutes on a tag that's going to be
        # rejected anyway. GH_TOKEN is gh CLI's own env var convention
        # (auto-detected, not spliced into any run: script body).
        # Read-only: querying releases/tags doesn't need contents:write.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: .github/scripts/reject-existing-release.sh "${GITHUB_REF_NAME}"

      - name: Compute build identifier (FR-005)
        # GITHUB_RUN_NUMBER.GITHUB_RUN_ATTEMPT -- deterministic, and
        # (GITHUB_RUN_NUMBER, GITHUB_RUN_ATTEMPT) strictly increases
        # across successful releases (SC-003). Exposed as a job output
        # (not a job-level env var like TARGET) since it's produced by a
        # script rather than a static value, and the release job (a
        # separate job) needs it too.
        id: build_id
        # A bare `echo "value=$(cmd)"` would swallow a failing `cmd`:
        # the compound command's exit status is echo's, not the command
        # substitution's, so GitHub Actions' default `bash -e {0}` (no
        # `pipefail`) would never notice and the step would pass green
        # with an empty value -- silently producing a malformed,
        # unidentified release artifact instead of failing the job. A
        # separate assignment does propagate the failure correctly.
        run: |
          build_id="$(.github/scripts/build-identifier.sh)"
          echo "value=${build_id}" >> "$GITHUB_OUTPUT"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable

      - name: Cache cargo dependencies and build output
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Test (cargo test --locked)
        # --locked, not `make test`'s plain `cargo test`: an unlocked test
        # run silently rewrites a drifted Cargo.lock, so by the time the
        # --locked release build below runs, the lock would already be
        # "fixed" and the drift it's meant to catch would never surface.
        run: cargo test --locked

      - name: Build release binary (FR-002)
        # --locked: this is a release artifact users download -- fail loud
        # if Cargo.lock has drifted from the manifests rather than silently
        # building against dependency versions the lock file never recorded.
        run: cargo build --release -p iklo-cli --locked

      - name: Package release binary (FR-003)
        # Stages a target-triple-and-build-identifier-named copy under a
        # dedicated dist/ directory for the checksum step and the release
        # job (via upload-artifact below) to consume.
        env:
          BUILD_ID: ${{ steps.build_id.outputs.value }}
        run: |
          mkdir -p dist
          cp target/release/iklo "dist/iklo-${GITHUB_REF_NAME}-${TARGET}-${BUILD_ID}"

      - name: Generate SHA-256 checksums (FR-012)
        env:
          BUILD_ID: ${{ steps.build_id.outputs.value }}
        run: .github/scripts/generate-checksums.sh "dist/iklo-${GITHUB_REF_NAME}-${TARGET}-${BUILD_ID}"

      - name: Generate release notes (FR-006)
        run: .github/scripts/release-notes.sh "${GITHUB_REF_NAME}" > dist-notes.md

      - name: Upload build artifacts
        # Hands off dist/ (binary + checksum) and the notes file to the
        # release job below, which runs in a separate job specifically so
        # it -- and only it -- gets contents: write.
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-assets
          path: |
            dist/
            dist-notes.md
          if-no-files-found: error

  release:
    name: Publish Release
    needs: build
    runs-on: ubuntu-latest
    # Least-privilege: ONLY this job gets contents: write, and only
    # because it's the one job that actually calls `gh release create`.
    # The build job above (which runs cargo build/test -- arbitrary
    # dependency code) stays read-only for its entire lifetime.
    permissions:
      contents: write
    env:
      BUILD_ID: ${{ needs.build.outputs.build_id }}
      TARGET: x86_64-unknown-linux-gnu
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-assets

      - name: Verify tag still points at the built commit
        # --verify-tag (below) only confirms a tag with this name still
        # exists remotely -- it does NOT confirm it still points at the
        # exact commit the build job checked out and tested. If the tag
        # were force-moved to a different commit between the build job's
        # checkout and this step, --verify-tag alone would happily
        # publish a release under this tag built from a commit that was
        # never what the tag currently names. Compare explicitly.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          remote_sha="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_REF_NAME}" -q .sha)"
          if [ "$remote_sha" != "${GITHUB_SHA}" ]; then
            echo "error: tag '${GITHUB_REF_NAME}' now points at ${remote_sha}, not the commit this workflow run built and tested (${GITHUB_SHA}) -- refusing to publish" >&2
            exit 1
          fi

      - name: Create GitHub Release (FR-003, FR-005, FR-006, FR-008, FR-012)
        # --title includes the build identifier (FR-005's "attached to
        # release metadata" half -- T015 only covered "artifact naming",
        # the other half of the same requirement; a traceability-table
        # audit caught this still being unfulfilled here).
        # Per plan.md's Key Design Decision #7: nothing PUBLICLY VISIBLE
        # exists until every asset is attached and the notes are set --
        # NOT created first and uploaded to afterward in separate
        # user-visible steps. (Correction: `gh release create` itself
        # internally makes separate API calls -- create as a draft,
        # upload each asset, then publish -- per its own --help text.
        # The guarantee this buys is "no published release before every
        # asset lands", not "one API call". If asset upload AND its
        # failure-cleanup both fail, a stray DRAFT release can be left
        # behind; verified empirically that the dedup check's
        # `releases/tags/<tag>` query does NOT see draft releases (only
        # published ones), so such a draft would not be caught by a
        # re-run's dedup check -- it would create a second draft rather
        # than being rejected. Not handled here; worth revisiting if it
        # happens in practice.)
        # --verify-tag: if the pushed tag were somehow deleted remotely
        # mid-run, gh would otherwise silently create a NEW tag at
        # main's current HEAD and publish that instead -- shipping code
        # that was never what this job actually built and tested. (The
        # step above catches the "tag moved, not deleted" variant of the
        # same risk.)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            "dist/iklo-${GITHUB_REF_NAME}-${TARGET}-${BUILD_ID}" \
            "dist/iklo-${GITHUB_REF_NAME}-${TARGET}-${BUILD_ID}.sha256" \
            --title "${GITHUB_REF_NAME} (build ${BUILD_ID})" \
            --notes-file dist-notes.md \
            --verify-tag
